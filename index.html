<!doctype html>
<html lang="sa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>संस्कृतप्रश्नमञ्जरी</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E0%A5%90%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ground: #F4EFE6;
    --card: #FDFAF3;
    --ink: #26221C;
    --ink-soft: #6B6154;
    --line: #E0D7C6;
    --accent: #A66A0E;
    --accent-soft: #F3E7CE;
    --gold: #C8891A;
    --good: #2E7D32;
    --good-soft: #E3F1E4;
    --bad: #C62828;
    --bad-soft: #FBE7E7;
    --shadow: 0 2px 12px rgba(60, 45, 20, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #171320;
      --card: #221C30;
      --ink: #EFE8D8;
      --ink-soft: #A79C86;
      --line: #372E4A;
      --accent: #E0A83A;
      --accent-soft: #33283D;
      --gold: #E0A83A;
      --good: #66BB6A;
      --good-soft: #1D3321;
      --bad: #EF5350;
      --bad-soft: #3B1D1F;
      --shadow: 0 2px 14px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="light"] {
    --ground: #F4EFE6;
    --card: #FDFAF3;
    --ink: #26221C;
    --ink-soft: #6B6154;
    --line: #E0D7C6;
    --accent: #A66A0E;
    --accent-soft: #F3E7CE;
    --gold: #C8891A;
    --good: #2E7D32;
    --good-soft: #E3F1E4;
    --bad: #C62828;
    --bad-soft: #FBE7E7;
    --shadow: 0 2px 12px rgba(60, 45, 20, .08);
  }
  :root[data-theme="dark"] {
    --ground: #171320;
    --card: #221C30;
    --ink: #EFE8D8;
    --ink-soft: #A79C86;
    --line: #372E4A;
    --accent: #E0A83A;
    --accent-soft: #33283D;
    --gold: #E0A83A;
    --good: #66BB6A;
    --good-soft: #1D3321;
    --bad: #EF5350;
    --bad-soft: #3B1D1F;
    --shadow: 0 2px 14px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: 'Noto Serif Devanagari', 'Adobe Devanagari', 'Kohinoor Devanagari', 'Devanagari Sangam MN', 'Nirmala UI', 'Noto Sans Devanagari', 'Mangal', serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 40px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 14px 0 10px;
  }
  .masthead {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: .01em;
    color: var(--ink);
    text-wrap: balance;
    line-height: 1.3;
  }
  .masthead .danda { color: var(--gold); font-weight: 400; }
  .tagline {
    font-size: .85rem;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 10px 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .hud .stat {
    font-size: .92rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .hud .stat b { color: var(--ink); font-weight: 700; }
  .bar {
    flex: 1;
    height: 6px;
    border-radius: 3px;
    background: var(--line);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--gold);
    border-radius: 3px;
    transition: width .25s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 20px 18px 18px;
    margin-top: 10px;
    animation: slidein .18s ease;
  }
  @keyframes slidein {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .bar i { transition: none; }
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: .78rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 12px;
    letter-spacing: .02em;
  }
  .lvl {
    font-size: .78rem;
    color: var(--ink-soft);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .lvl .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--good);
  }
  .lvl.l1 .dot { background: var(--gold); }
  .lvl.l2 .dot { background: var(--bad); }

  .qtext {
    font-size: 1.32rem;
    line-height: 1.55;
    font-weight: 600;
    margin: 0 0 18px;
    text-wrap: balance;
  }

  .opts {
    display: grid;
    gap: 10px;
  }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 1.12rem;
    line-height: 1.45;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    padding: 13px 14px;
    min-height: 56px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  .opt:not(:disabled):active { transform: scale(.985); }
  @media (hover: hover) {
    .opt:not(:disabled):hover { border-color: var(--gold); background: var(--accent-soft); }
  }
  .opt:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .opt .key {
    flex: none;
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    font-size: .85rem;
    color: var(--ink-soft);
  }
  .opt:disabled { cursor: default; }
  .opt.correct {
    background: var(--good-soft);
    border-color: var(--good);
    color: var(--ink);
  }
  .opt.correct .key { border-color: var(--good); background: var(--good); color: #fff; }
  .opt.wrong {
    background: var(--bad-soft);
    border-color: var(--bad);
  }
  .opt.wrong .key { border-color: var(--bad); background: var(--bad); color: #fff; }
  .opt.dim { opacity: .5; }

  .verdict {
    min-height: 1.6em;
    margin-top: 14px;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
  }
  .verdict.ok { color: var(--good); }
  .verdict.no { color: var(--bad); }

  /* ---------- start & end screens ---------- */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 30px 22px;
    margin-top: 14px;
    text-align: center;
    animation: slidein .18s ease;
  }
  .panel h2 {
    margin: 0 0 6px;
    font-size: 1.35rem;
    text-wrap: balance;
  }
  .panel p { color: var(--ink-soft); line-height: 1.7; margin: 8px 0 0; }
  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 18px 0 4px;
  }
  .bigscore {
    font-size: 3rem;
    font-weight: 700;
    color: var(--gold);
    margin: 12px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .btn {
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 14px 38px;
    margin-top: 22px;
    cursor: pointer;
    transition: transform .06s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  .ornament {
    text-align: center;
    color: var(--gold);
    font-size: 1.1rem;
    margin-top: 26px;
    letter-spacing: .3em;
    user-select: none;
  }
  .panel .note {
    font-size: .88rem;
    margin-top: 16px;
  }
  .panel .note.done { color: var(--good); font-weight: 700; }
  .hidden { display: none !important; }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="masthead"><span class="danda">॥</span> संस्कृतप्रश्नमञ्जरी <span class="danda">॥</span></div>
    <div class="tagline">गृहे एव संस्कृतक्रीडा — व्याकरणं, पुराणं, सुभाषितानि च</div>
  </header>

  <div class="hud hidden" id="hud">
    <span class="stat" id="prog">प्रश्नः १</span>
    <div class="bar"><i id="fill"></i></div>
    <span class="stat">अङ्काः <b id="score">०</b></span>
  </div>

  <!-- start screen -->
  <section class="panel" id="start">
    <h2>स्वागतम्&nbsp;!</h2>
    <p><span id="qcount"></span> प्रश्नाः — मिश्रितक्रमेण ।<br>
    सम्यक् उत्तरं <b style="color:var(--good)">हरितम्</b>, अशुद्धं <b style="color:var(--bad)">रक्तम्</b> भविष्यति ।</p>
    <div class="topics" id="topiclist"></div>
    <p class="note" id="note-start"></p>
    <button class="btn" id="startbtn">आरभताम् →</button>
  </section>

  <!-- quiz card -->
  <section class="card hidden" id="quiz">
    <div class="meta">
      <span class="chip" id="topic"></span>
      <span class="lvl" id="lvl"><span class="dot"></span><span id="lvltxt"></span></span>
    </div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div class="verdict" id="verdict" aria-live="polite"></div>
  </section>

  <!-- end screen -->
  <section class="panel hidden" id="end">
    <h2>क्रीडा समाप्ता&nbsp;!</h2>
    <div class="bigscore" id="final"></div>
    <p id="msg"></p>
    <p class="note" id="note-end"></p>
    <button class="btn" id="again">पुनः क्रीडतु ↻</button>
  </section>

  <div class="ornament">❖ ❖ ❖</div>
</div>

<script>
'use strict';

/* ---------- question bank ----------
   t = topic, d = difficulty (0 easy, 1 medium, 2 hard)
   a[0] is always the correct answer; options are shuffled at render.
   Sources: Paninian grammar, Amarakosha, Puranas, Upanishads,
   Ramayana, Mahabharata, subhashita collections, world geography. */
/* AUTO-GENERATED:SET:START — overwritten by scripts/generate-questions.mjs, do not hand-edit */
const SET_ID = '2026-10-22';
/* AUTO-GENERATED:SET:END */

/* AUTO-GENERATED:TOPICS:START — overwritten daily by scripts/generate-questions.mjs, do not hand-edit */
const T = {
  vy: 'व्याकरणम्',
  pu: 'पुराणकथा',
  de: 'देवतायाः',
  gk: 'भारतज्ञानम्',
  wg: 'विश्वज्ञानम्',
  rc: 'राजधानीज्ञानम्',
  it: 'इतिहासः',
  su: 'सुभाषितपूर्तिः',
  sh: 'शब्दज्ञानम्',
  sa: 'साहित्यम्'
};
/* AUTO-GENERATED:TOPICS:END */

/* AUTO-GENERATED:QUESTIONS:START — overwritten daily by scripts/generate-questions.mjs, do not hand-edit */
const BANK = [
/* ==========================================================
   100 questions — 30 easy, 40 medium, 30 hard
   Auto-generated 2026-10-22 via gemini:gemini-3-flash-preview
   ========================================================== */

/* 1 */ {t:"vy", d:0, q:"'मुनि' शब्दस्य तृतीया-एकवचने किं रूपं भवति?", a:["मुनिना","मुनेः","मुनौ","मुनिम्"]},
/* 2 */ {t:"vy", d:0, q:"'लिख्' धातोः लृट् लकारे प्रथमपुरुषैकवचनं किम्?", a:["लेखिष्यति","लिखति","अलिखत्","लिखतु"]},
/* 3 */ {t:"vy", d:0, q:"'महोत्सवः' इत्यस्य कः सन्धिच्छेदः अस्ति?", a:["महा + उत्सवः","महो + त्सवः","मह + उत्सवः","महोत् + सवः"]},
/* 4 */ {t:"pu", d:0, q:"महाभारते धृतराष्ट्रस्य सारथिः कः आसीत्?", a:["सञ्जयः","विदुरः","कृपाचार्यः","शकुनिः"]},
/* 5 */ {t:"pu", d:0, q:"श्रीकृष्णस्य प्रियः सखा कः आसीत्?", a:["अर्जुनः","भीमः","नकुलः","सहदेवः"]},
/* 6 */ {t:"pu", d:0, q:"रामायणे कस्य वानरराजस्य राज्यं किष्किन्धा आसीत्?", a:["सुग्रीवस्य","अङ्गदः","नलः","नीलः"]},
/* 7 */ {t:"de", d:0, q:"सूर्यदेवस्य रथस्य कति अश्वाः सन्ति?", a:["सप्त","पञ्च","दश","अष्ट"]},
/* 8 */ {t:"de", d:0, q:"यमराजस्य वाहनं किम् अस्ति?", a:["महिषः","शशः","कुक्कुरः","विडालः"]},
/* 9 */ {t:"de", d:0, q:"कुबेरस्य नगरी का अस्ति?", a:["अलकापुरी","मथुरा","द्वारावती","अयोध्या"]},
/* 10 */ {t:"gk", d:0, q:"भारतस्य राष्ट्रियमुद्रायां किं वाक्यं लिखितम् अस्ति?", a:["सत्यमेव जयते","वन्दे मातरम्","जय हिन्द","जन गण मन"]},
/* 11 */ {t:"gk", d:0, q:"प्रसिद्धं सूर्यमन्दिरं कुत्र स्थितम् अस्ति?", a:["कोणारके","पुर्याम्","काश्याम्","मथुरायाम्"]},
/* 12 */ {t:"gk", d:0, q:"गायत्री मन्त्रः कस्मिन् वेदे प्राप्तो भवति?", a:["ऋग्वेदे","सामवेदे","यजुर्वेदे","अथर्ववेदे"]},
/* 13 */ {t:"wg", d:0, q:"विश्वस्य प्रथमः विश्वविद्यालयः कः अस्ति?", a:["तक्षशिला","नालन्दा","आक्स्फोर्ड्","केम्ब्रिड्ज्"]},
/* 14 */ {t:"wg", d:0, q:"कः देशः 'उदीयमानस्य सूर्यस्य देशः' इति कथ्यते?", a:["जापान","चीन","भारतम्","रशिया"]},
/* 15 */ {t:"wg", d:0, q:"विश्वस्य बृहत्तमं वर्षावनं किम् अस्ति?", a:["अमेझन्","सुन्दर्वनम्","ताएगा","काङ्गो"]},
/* 16 */ {t:"rc", d:0, q:"महाराष्ट्रराज्यस्य राजधानी का अस्ति?", a:["मुम्बई","पुणे","नागपुरम्","नाशिकम्"]},
/* 17 */ {t:"rc", d:0, q:"भूटानदेशस्य राजधानी का अस्ति?", a:["थिम्पू","काठमाण्डु","ढाका","कोलम्बो"]},
/* 18 */ {t:"rc", d:0, q:"श्रीलङ्कादेशस्य प्रशासनिकी राजधानी का अस्ति?", a:["श्रीजयवर्धनेपुराकोट्टे","कोलम्बो","क्याण्डी","जाफना"]},
/* 19 */ {t:"it", d:0, q:"भारतदेशे मुगलवंशस्य संस्थापकः कः आसीत्?", a:["बाबरः","अकबरः","हुमायूँ","शाहजहाँ"]},
/* 20 */ {t:"it", d:0, q:"कः गुप्तराजा 'विक्रमादित्यः' इति उपाधिना प्रसिद्धः?", a:["चन्द्रगुप्तः द्वितीयः","समुद्रगुप्तः","स्कन्दगुप्तः","कुमारगुप्तः"]},
/* 21 */ {t:"it", d:0, q:"महाराणाप्रतापस्य वीर-अश्वस्य नाम किम् आसीत्?", a:["चेतकः","पवनः","बादलः","विजयः"]},
/* 22 */ {t:"su", d:0, q:"परोपकाराय पुण्याय _____ भवति। रिक्तस्थानं पूरयत।", a:["पापाय परपीडनम्","सुखाय विद्या","दानाय धनम्","शान्तये मनः"]},
/* 23 */ {t:"su", d:0, q:"परोपकाराय फलन्ति वृक्षाः, परोपकाराय _____ नद्यः।", a:["वहन्ति","पिबन्ति","गच्छन्ति","पठन्ति"]},
/* 24 */ {t:"su", d:0, q:"वृक्षाः स्वयं न खादन्ति _____। रिक्तस्थानं पूरयत।", a:["फलानि","पत्रानि","पुष्पाणि","जलं"]},
/* 25 */ {t:"sh", d:0, q:"'पवनः' इत्यस्य कः पर्यायः अस्ति?", a:["वायुः","अनलः","सलिलम्","गिरिः"]},
/* 26 */ {t:"sh", d:0, q:"'वृक्षः' इत्यस्य कः पर्यायः अस्ति?", a:["तरुः","तृणम्","अम्बरम्","सरः"]},
/* 27 */ {t:"sh", d:0, q:"'पृथ्वी' इत्यस्य कः पर्यायः अस्ति?", a:["धरा","व्योम","वारि","समीरः"]},
/* 28 */ {t:"sa", d:0, q:"'मालविकाग्निमित्रम्' इति नाटकस्य रचयिता कः?", a:["कालिदासः","भासः","भवभूतिः","भारविः"]},
/* 29 */ {t:"sa", d:0, q:"'रघुवंशम्' महाकाव्ये कति सर्गाः सन्ति?", a:["एकोनविंशतिः","अष्टादश","सप्तदश","विशतिः"]},
/* 30 */ {t:"sa", d:0, q:"'किरातार्जुनीयम्' कस्य महाकवेः रचना अस्ति?", a:["भारवेः","माघस्य","श्रीहर्षस्य","दण्डिनः"]},
/* 31 */ {t:"vy", d:1, q:"'रमा' शब्दस्य सप्तमीविभक्त्याः एकवचने किं रूपं भवति?", a:["रमायाम्","रमे","रमासु","रमायाः"]},

/* 99 */ {t:"sa", d:2, q:"महाकवेः कालिदासस्य 'मेघदूतम्' कस्य काव्यप्रकारस्य अन्तर्गतं भवति?", a:["खण्डकाव्यस्य","महाकाव्यस्य","चम्पूकाव्यस्य","गद्यकाव्यस्य"]},
/* 100 */ {t:"sa", d:2, q:"बाणभट्टेन विरचिते 'हर्षचरिते' कति उच्छ्वासाः सन्ति?", a:["अष्टौ","दश","पञ्च","द्वादश"]}
];
/* AUTO-GENERATED:QUESTIONS:END */

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const DV = '०१२३४५६७८९';
const dv = n => String(n).replace(/\d/g, d => DV[d]);
const LVL = ['सरलम्', 'मध्यमम्', 'कठिनम्'];
const KEYS = ['क', 'ख', 'ग', 'घ'];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- refresh signal ----------
   The question set is only regenerated (scripts/generate-questions.mjs) if
   someone answered at least half of the current set. Answered questions are
   remembered per set on this device, so a reload doesn't lose progress; once
   the threshold is crossed we ping a public counter the workflow reads. */
const COUNTER_NS = 'adithyahrudai-sanskrit-quiz';
const COUNTER_URL = 'https://abacus.jasoncameron.dev/hit/' + COUNTER_NS + '/set-' + SET_ID;
const NEED = Math.ceil(BANK.length / 2);
const ANS_KEY = 'sq:' + SET_ID + ':answered';
const SENT_KEY = 'sq:' + SET_ID + ':sent';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// drop progress kept for earlier sets
try {
  Object.keys(localStorage)
    .filter(k => k.startsWith('sq:') && !k.startsWith('sq:' + SET_ID + ':'))
    .forEach(k => localStorage.removeItem(k));
} catch (e) {}

let answered;
try { answered = new Set(JSON.parse(store.get(ANS_KEY)) || []); } catch (e) { answered = new Set(); }
let sent = store.get(SENT_KEY) === '1', sending = false;

function markAnswered(q) {
  const i = BANK.indexOf(q);
  if (i < 0 || answered.has(i)) return;
  answered.add(i);
  store.set(ANS_KEY, JSON.stringify([...answered]));
  report();
}

function report() {
  if (sent || sending || answered.size < NEED) return;
  sending = true;
  fetch(COUNTER_URL, { cache: 'no-store', keepalive: true })
    .then(r => { if (r.ok) { sent = true; store.set(SENT_KEY, '1'); } })
    .catch(() => {})
    .finally(() => { sending = false; });
}

function showNote(el) {
  const done = answered.size >= NEED;
  el.className = 'note' + (done ? ' done' : '');
  el.textContent = done
    ? 'लक्ष्यं साधितम् ! श्वः नूतनाः प्रश्नाः आगमिष्यन्ति ।'
    : 'प्रश्नानाम् अर्धे उत्तरिते श्वः नूतनाः प्रश्नाः आगमिष्यन्ति — उत्तरिताः ' + dv(answered.size) + ' / ' + dv(NEED);
}

/* ---------- state ---------- */
let order = [], idx = 0, score = 0, locked = false, timer = null;

function buildOrder() {
  // fully jumbled on every start — all topics and difficulties randomly mixed
  order = shuffle(BANK);
}

/* ---------- screens ---------- */
function showStart() {
  const list = $('topiclist');
  list.innerHTML = '';
  Object.values(T).forEach(name => {
    const s = document.createElement('span');
    s.className = 'chip';
    s.textContent = name;
    list.appendChild(s);
  });
  const countText = $('qcount');
  if (countText) countText.textContent = dv(BANK.length);
  showNote($('note-start'));
}

function startGame() {
  buildOrder();
  idx = 0; score = 0;
  $('score').textContent = dv(0);
  $('start').classList.add('hidden');
  $('end').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('quiz').classList.remove('hidden');
  render();
}

function render() {
  clearTimeout(timer);
  locked = false;
  const q = order[idx];

  $('prog').textContent = 'प्रश्नः ' + dv(idx + 1) + ' / ' + dv(order.length);
  $('fill').style.width = (idx / order.length * 100) + '%';
  $('topic').textContent = T[q.t];
  $('lvl').className = 'lvl l' + q.d;
  $('lvltxt').textContent = LVL[q.d];
  $('qtext').textContent = q.q;
  $('verdict').textContent = '';
  $('verdict').className = 'verdict';

  const card = $('quiz');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';

  const box = $('opts');
  box.innerHTML = '';
  shuffle(q.a.map((text, i) => ({ text, ok: i === 0 }))).forEach((opt, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.innerHTML = '<span class="key">' + KEYS[i] + '</span><span></span>';
    b.lastChild.textContent = opt.text;
    b.addEventListener('click', () => pick(b, opt.ok));
    box.appendChild(b);
  });
}

function pick(btn, ok) {
  if (locked) return;
  locked = true;

  const buttons = [...$('opts').children];
  buttons.forEach(b => { b.disabled = true; });
  markAnswered(order[idx]);

  if (ok) {
    btn.classList.add('correct');
    buttons.forEach(b => { if (b !== btn) b.classList.add('dim'); });
    score++;
    $('score').textContent = dv(score);
    $('verdict').textContent = 'साधु ! सम्यक् उत्तरम् ।';
    $('verdict').classList.add('ok');
  } else {
    btn.classList.add('wrong');
    buttons.forEach(b => {
      const q = order[idx];
      if (b.lastChild.textContent === q.a[0]) b.classList.add('correct');
      else if (b !== btn) b.classList.add('dim');
    });
    $('verdict').textContent = 'अशुद्धम् ! हरितम् एव सम्यक् ।';
    $('verdict').classList.add('no');
  }

  timer = setTimeout(next, ok ? 900 : 1600);
}

function next() {
  idx++;
  if (idx >= order.length) return finish();
  render();
}

function finish() {
  $('quiz').classList.add('hidden');
  $('hud').classList.add('hidden');
  $('fill').style.width = '100%';
  $('end').classList.remove('hidden');
  $('final').textContent = dv(score) + ' / ' + dv(order.length);

  const pct = score / order.length;
  let msg;
  if (pct >= 0.9)      msg = 'अद्भुतम् ! भवती तु साक्षात् विदुषी — सरस्वत्याः कृपा भवत्याम् अस्ति ।';
  else if (pct >= 0.7) msg = 'उत्तमम् ! संस्कृतज्ञानं प्रशंसनीयम् — किञ्चित् अभ्यासेन सर्वोत्तमं भविष्यति ।';
  else if (pct >= 0.5) msg = 'साधु ! अर्धाधिकं साधितम् — पुनः क्रीडित्वा अधिकं जानातु ।';
  else                 msg = 'शुभारम्भः ! अभ्यासेन एव विद्या वर्धते — पुनः प्रयतताम् ।';
  $('msg').textContent = msg;
  showNote($('note-end'));
}

/* ---------- wire up ---------- */
$('startbtn').addEventListener('click', startGame);
$('again').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden') || locked) return;
  const n = '1234'.indexOf(e.key);
  if (n >= 0) {
    const b = $('opts').children[n];
    if (b) b.click();
  }
});

showStart();
report(); // retry a ping that failed last time (e.g. while offline)
</script>
