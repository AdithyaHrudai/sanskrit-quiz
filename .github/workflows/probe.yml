name: Gemini quota probe (temporary)
on:
  workflow_dispatch:
    inputs:
      calls:
        description: 'calls per model, back to back'
        default: '1'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CALLS: ${{ inputs.calls }}
        run: |
          for model in gemini-2.5-flash gemini-2.5-flash-lite; do
            for i in $(seq 1 "$CALLS"); do
              code=$(curl -s -m 60 -o body.json -w '%{http_code}' -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent" \
                -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
                -d '{"contents":[{"parts":[{"text":"Reply with the single word OK"}]}]}')
              echo "$model call $i -> HTTP $code"
              if [ "$code" != "200" ]; then
                jq -c '.error | {code, status, message: (.message|.[0:400]), details: [.details[]? | (.violations // .retryDelay // .reason // .)]}' body.json || cat body.json
              fi
            done
          done
          exit 0
