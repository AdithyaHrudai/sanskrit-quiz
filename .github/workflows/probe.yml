name: Gemini quota probe (temporary)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "--- models that support generateContent"
          curl -s -m 30 "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" -H "x-goog-api-key: $GEMINI_API_KEY" \
            | jq -r '.models[] | select(.supportedGenerationMethods | index("generateContent")) | .name' | grep -iE "flash|pro|gemma" | tr '\n' ' '
          echo
          echo "--- one call per candidate"
          for model in gemini-2.5-flash gemini-2.5-flash-lite gemini-2.5-pro gemini-flash-latest gemini-flash-lite-latest gemini-3-flash-preview gemini-3.1-flash-lite-preview; do
            code=$(curl -s -m 60 -o body.json -w '%{http_code}' -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent" \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H 'Content-Type: application/json' \
              -d '{"contents":[{"parts":[{"text":"Reply with the single word OK"}]}]}')
            echo "$model -> HTTP $code"
            if [ "$code" != "200" ]; then
              jq -c '.error | {code, status, message: (.message|.[0:200]), details: [.details[]? | (.violations // .retryDelay // .reason // empty)]}' body.json 2>/dev/null || head -c 300 body.json
            fi
            sleep 13
          done
          exit 0
