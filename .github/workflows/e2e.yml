name: Live generator test (temporary)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: daily-questions
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run the real generator (nothing is committed)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          FINAL_ATTEMPT: 'true'
        run: node scripts/generate-questions.mjs
      - name: Show result
        run: |
          echo "=== last-run.json"
          cat data/last-run.json
          echo "=== generated set"
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const t = new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10);
            console.log("count", s.length);
            for (const q of s) console.log(["E","M","H"][q.d], q.t, "|", q.q, "=>", q.a[0], "||", q.a.slice(1).join(" / "));
          ' "data/questions-archive/$(TZ=Asia/Kolkata date +%Y-%m-%d).json" || echo "no new archive file (generator did not complete)"
