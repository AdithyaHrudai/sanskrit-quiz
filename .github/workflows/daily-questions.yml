name: Daily question refresh

# Refreshes the question set at most once per day, and only if someone
# answered at least half of the current set (see AUTOMATION.md). On days
# nobody played, every run exits quietly without touching the repo. API
# flakiness only logs a warning (a later run retries); a run is marked failed
# — and GitHub sends its email — only for real breakage (see shouldFail() in
# scripts/generate-questions.mjs).
on:
  schedule:
    - cron: '30 2 * * *'    # 08:00 IST — main slot
    - cron: '30 6 * * *'    # 12:00 IST — retry if the morning run hit a flaky API
    - cron: '30 10 * * *'   # 16:00 IST — last retry; only this slot reports failures
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh even if nobody has played the current set'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # keepalive step below

concurrency:
  group: daily-questions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # GitHub disables cron workflows after 60 days without repo activity —
      # which now happens whenever nobody plays for two months. Re-enabling
      # via the API resets that timer without needing a commit.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/daily-questions.yml/enable"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Refresh question bank if the current set was played
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          FORCE_REFRESH: ${{ inputs.force }}
          FINAL_ATTEMPT: ${{ github.event_name != 'schedule' || github.event.schedule == '30 10 * * *' }}
        run: node scripts/generate-questions.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "sanskrit-quiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/questions-archive data/last-run.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Question refresh: $(TZ=Asia/Kolkata date +%Y-%m-%d)"
            # rebase first so a commit pushed to main while we were generating can't fail the push
            for attempt in 1 2 3; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
              sleep 5
            done
            echo "::error::Could not push the refreshed question set"
            exit 1
          fi
